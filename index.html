<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive single-page application demonstration.">
  <title>Nova — Single Page Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="page-glow glow-one"></div>
  <div class="page-glow glow-two"></div>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="Nova home"><span class="brand-mark">N</span><span>nova<span class="brand-dot">.</span></span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a href="#home" data-route="home">Home</a>
      <a href="#about" data-route="about">About</a>
      <a href="#services" data-route="services">Services</a>
      <a href="#contact" data-route="contact">Contact</a>
    </nav>
    <a class="header-cta" href="#contact">Let's talk <span>↗</span></a>
  </header>

  <main id="app" class="app-shell" tabindex="-1" aria-live="polite">
    <!-- JavaScript renders the selected page here. -->
    <section class="loading-state"><span class="loader"></span><p>Preparing your experience…</p></section>
  </main>

  <footer class="site-footer">
    <a class="brand footer-brand" href="#home"><span class="brand-mark">N</span><span>nova<span class="brand-dot">.</span></span></a>
    <p>Thoughtful digital experiences, made simple.</p>
    <span>© <span id="year"></span> Nova Studio</span>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
